<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your E-Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Dancing+Script&family=Playfair+Display&family=Courier+Prime&family=Pacifico&family=Lato&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  background:#e8e0d5;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Special Elite',cursive;
}

/* ─── ENVELOPE ─── */
#envelope{
  position:relative;
  width:340px;
  height:230px;
  background:#f5e1b3;
  border:2px solid #d4b87a;
  border-radius:4px;
  box-shadow:0 8px 28px rgba(0,0,0,.3);
  cursor:pointer;
  user-select:none;
}
#envelope:hover{ box-shadow:0 12px 36px rgba(0,0,0,.38); }

/* fold-line decoration */
#envDeco{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:1;
}

/* flap wrapper — sits over the top portion, flips on .open */
#flapWrap{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:50%;          /* covers top half */
  overflow:hidden;     /* clips the triangle to the envelope top */
  transform-origin:top center;
  transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);
  z-index:4;
  pointer-events:none;
  /* 3-D flip */
  perspective:600px;
}
#flapWrap.open{
  transform:rotateX(180deg);
}
#flapSvg{
  width:100%;
  height:200%; /* triangle fills double the wrapper height so it looks right */
  display:block;
}

#stamp{
  position:absolute;
  top:10px; right:12px;
  width:50px;
  border:2px solid rgba(0,0,0,.15);
  box-shadow:2px 2px 5px rgba(0,0,0,.2);
  z-index:3;
  pointer-events:none;
}

#addressBlock{
  position:absolute;
  left:50%; top:62%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:13px;
  line-height:1.55;
  color:#333;
  z-index:3;
  max-width:60%;
  pointer-events:none;
}
#addressBlock p{margin:1px 0}

#envHint{
  position:absolute;
  bottom:8px; left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:rgba(0,0,0,.35);
  white-space:nowrap;
  z-index:5;
  pointer-events:none;
}

/* ─── CARD BOOK ─── */
#cardBook{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  align-items:center;
  justify-content:center;
}

#bookWrap{
  display:flex;
  border-radius:4px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  overflow:hidden;
}

.page{
  position:relative;
  overflow:hidden;
  background:#fff;
  flex-shrink:0;
  /* display toggled by JS */
}
/* spine shadow on right pages */
.page-r::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:8px;
  background:linear-gradient(to right,rgba(0,0,0,.2),transparent);
  z-index:2;
  pointer-events:none;
}
#frontPage {border-radius:4px 0 0 4px}
#backPage  {border-radius:0 4px 4px 0}

.page-img{width:100%;height:100%;object-fit:cover;display:block}

#insideLeftPage{
  background:#fdf6ec;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:22px;
  gap:10px;
}
#insideLeftPage .placeholder{font-size:44px}
#insideLeftPage img{max-width:100%;max-height:80%;object-fit:contain;border-radius:6px}

#insideRightPage{
  background:#fdfaf5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 22px;
}
.msg{
  font-size:18px;
  line-height:1.75;
  color:#333;
  white-space:pre-wrap;
  text-align:center;
  max-width:100%;
}

#backPage .back-inner{
  width:100%;height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  padding:22px;
  background:repeating-linear-gradient(0deg,transparent,transparent 27px,#e8e0d0 27px,#e8e0d0 28px);
}
.back-note{font-size:13px;color:#aaa;text-align:center}

/* nav */
.nav-btn{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:46px;height:46px;
  background:rgba(255,255,255,.92);
  border:none;border-radius:50%;
  font-size:22px;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
}
.nav-btn:hover{background:#fff}
#prevBtn{left:14px}
#nextBtn{right:14px}
#closeBtn{
  position:fixed;
  top:14px;right:14px;
  width:40px;height:40px;
  background:rgba(255,255,255,.92);
  border:none;border-radius:50%;
  font-size:18px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
}
#closeBtn:hover{background:#fff}
#pageIndicator{
  position:fixed;
  bottom:18px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.5);
  color:#fff;font-size:12px;
  padding:5px 16px;
  border-radius:20px;
  z-index:300;
  display:none;
  pointer-events:none;
}

#errorMsg{
  color:#9a7a50;text-align:center;padding:40px;display:none;
}
#errorMsg a{color:#c0a060}
</style>
</head>
<body>

<div id="envelope">
  <!-- Decorative fold lines -->
  <svg id="envDeco" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line id="dl" x1="0" y1="0"   x2="170" y2="115" stroke="rgba(0,0,0,.07)" stroke-width="1.5"/>
    <line id="dr" x1="340" y1="0" x2="170" y2="115" stroke="rgba(0,0,0,.07)" stroke-width="1.5"/>
    <line id="db" x1="0" y1="230" x2="170" y2="115" stroke="rgba(0,0,0,.05)" stroke-width="1.5"/>
  </svg>

  <!-- Flap -->
  <div id="flapWrap">
    <svg id="flapSvg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <polygon id="flapPoly" points="0,0 100,0 50,100" fill="#d4b87a"/>
    </svg>
  </div>

  <img id="stamp" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA4MCAxMDAnPjxyZWN0IHdpZHRoPSc4MCcgaGVpZ2h0PScxMDAnIGZpbGw9JyMzZDFhNzgnIHJ4PScyJy8+PHJlY3QgeD0nNCcgeT0nNCcgd2lkdGg9JzcyJyBoZWlnaHQ9JzkyJyBmaWxsPSdub25lJyBzdHJva2U9JyM5YjdmZDQnIHN0cm9rZS13aWR0aD0nMS41JyBzdHJva2UtZGFzaGFycmF5PSc0LDInIHJ4PScxJy8+PGVsbGlwc2UgY3g9JzQwJyBjeT0nNDInIHJ4PScyMicgcnk9JzI2JyBmaWxsPScjNmI0YWIwJy8+PGVsbGlwc2UgY3g9JzM4JyBjeT0nNDAnIHJ4PScxOCcgcnk9JzIyJyBmaWxsPScjOGE2YmNjJy8+PHRleHQgeD0nMTAnIHk9JzkyJyBmb250LWZhbWlseT0nc2VyaWYnIGZvbnQtc2l6ZT0nMTInIGZpbGw9J3doaXRlJyBmb250LXN0eWxlPSdpdGFsaWMnPkk8L3RleHQ+PHRleHQgeD0nMjAnIHk9Jzg4JyBmb250LWZhbWlseT0nc2VyaWYnIGZvbnQtc2l6ZT0nOScgZmlsbD0nd2hpdGUnPlNUPC90ZXh0Pjwvc3ZnPg==" alt="stamp">
  <div id="addressBlock"></div>
  <span id="envHint">Click to open &#9993;</span>
</div>

<!-- Card Book -->
<div id="cardBook">
  <div id="bookWrap">
    <div class="page" id="frontPage">
      <img class="page-img" id="frontImg" src="" alt="Front">
    </div>
    <div class="page page-r" id="insideLeftPage">
      <img id="insideImg" src="" alt="" style="display:none">
      <div class="placeholder">&#128155;</div>
    </div>
    <div class="page page-r" id="insideRightPage">
      <div class="msg" id="msgText"></div>
    </div>
    <div class="page page-r" id="backPage">
      <div class="back-inner">
        <div class="back-note" id="backNoteText"></div>
      </div>
    </div>
  </div>
  <button class="nav-btn" id="prevBtn" onclick="turnPage(-1)">&#8592;</button>
  <button class="nav-btn" id="nextBtn" onclick="turnPage(1)">&#8594;</button>
  <button id="closeBtn" onclick="closeCard()">&#10005;</button>
  <div id="pageIndicator"></div>
</div>

<div id="errorMsg">No card data found. <a href="index.html">Create a card here</a>.</div>

<script>
// ── params ──────────────────────────────────────────────────────────────
var P       = new URLSearchParams(window.location.search);
var pName   = P.get('name')     || '';
var pAddr   = P.get('address')  || '';
var pMsg    = P.get('message')  || '';
var pImg    = P.get('img')      || '';
var pShape  = P.get('shape')    || 'landscape';
var pColour = P.get('colour')   || '#f5e1b3';
var pFont   = P.get('font')     || 'Special Elite';
var pInside = P.get('insideImg')|| '';
var pBack   = P.get('back')     || '';

if (!pName || !pAddr || !pMsg || !pImg) {
  document.getElementById('errorMsg').style.display = 'block';
  document.getElementById('envelope').style.display = 'none';
} else {
  setup();
}

// ── helpers ─────────────────────────────────────────────────────────────
function darken(hex, n) {
  if (hex.length === 4)
    hex = '#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  var r=Math.max(0,parseInt(hex.slice(1,3),16)-n);
  var g=Math.max(0,parseInt(hex.slice(3,5),16)-n);
  var b=Math.max(0,parseInt(hex.slice(5,7),16)-n);
  return '#'+[r,g,b].map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}
function lum(hex) {
  if (hex.length === 4)
    hex = '#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  return 0.299*parseInt(hex.slice(1,3),16)/255
       + 0.587*parseInt(hex.slice(3,5),16)/255
       + 0.114*parseInt(hex.slice(5,7),16)/255;
}
function showFlex(id){ document.getElementById(id).style.display='flex'; }
function showBlock(id){ document.getElementById(id).style.display='block'; }
function hideEl(id){ document.getElementById(id).style.display='none'; }

// ── setup ────────────────────────────────────────────────────────────────
function setup() {
  var dims = { landscape:{w:340,h:230}, square:{w:280,h:280}, portrait:{w:230,h:340} };
  var d = dims[pShape] || dims.landscape;
  var W = d.w, H = d.h;

  // Envelope size + colour
  var env = document.getElementById('envelope');
  env.style.width   = W+'px';
  env.style.height  = H+'px';
  env.style.background  = pColour;
  env.style.borderColor = darken(pColour,18);

  // Deco SVG
  document.getElementById('envDeco').setAttribute('viewBox','0 0 '+W+' '+H);
  document.getElementById('dl').setAttribute('x2', W/2);
  document.getElementById('dl').setAttribute('y2', H/2);
  document.getElementById('dr').setAttribute('x1', W);
  document.getElementById('dr').setAttribute('x2', W/2);
  document.getElementById('dr').setAttribute('y2', H/2);
  document.getElementById('db').setAttribute('y1', H);
  document.getElementById('db').setAttribute('x2', W/2);
  document.getElementById('db').setAttribute('y2', H/2);

  // Flap colour
  document.getElementById('flapPoly').setAttribute('fill', darken(pColour,22));

  // Address colour
  document.getElementById('addressBlock').style.color =
    lum(pColour) < 0.42 ? 'rgba(255,255,255,.88)' : '#333';

  // Address lines
  var ab = document.getElementById('addressBlock');
  [pName].concat(pAddr.split('\n')).forEach(function(line){
    var p = document.createElement('p');
    p.textContent = line;
    ab.appendChild(p);
  });

  // Page sizing
  var maxH = Math.min(window.innerHeight * 0.84, 500);
  var pw = Math.round(maxH * W / H);
  document.querySelectorAll('.page').forEach(function(p){
    p.style.width  = pw+'px';
    p.style.height = maxH+'px';
    p.style.display = 'none'; // hide until book opens
  });

  // Card content
  document.getElementById('frontImg').src = pImg;
  var mt = document.getElementById('msgText');
  mt.textContent = pMsg;
  mt.style.fontFamily = "'"+pFont+"', cursive";

  if (pInside) {
    var ii = document.getElementById('insideImg');
    ii.src = pInside;
    ii.style.display = 'block';
    // hide heart placeholder
    var ph = document.querySelector('#insideLeftPage .placeholder');
    if (ph) ph.style.display = 'none';
  }

  document.getElementById('backNoteText').textContent = pBack || 'Made with ♥';
}

// ── envelope clicks ──────────────────────────────────────────────────────
var step = 0; // 0=closed 1=flap open 2=card open

document.getElementById('envelope').addEventListener('click', function(e) {
  if (step === 0) {
    // open flap
    document.getElementById('flapWrap').classList.add('open');
    document.getElementById('envHint').textContent = 'Click to open card &#127873;';
    step = 1;
  } else if (step === 1) {
    // open card
    step = 2;
    openCard();
  }
});

// ── card book ────────────────────────────────────────────────────────────
var spreads = [
  ['frontPage','insideLeftPage'],
  ['insideRightPage','backPage']
];
var cur = 0;

function openCard() {
  showFlex('cardBook');
  showFlex('prevBtn');
  showFlex('nextBtn');
  showFlex('closeBtn');
  showBlock('pageIndicator');
  showSpread(0);
}

function showSpread(i) {
  cur = i;
  document.querySelectorAll('.page').forEach(function(p){ p.style.display='none'; });
  showBlock(spreads[i][0]);
  showBlock(spreads[i][1]);
  document.getElementById('prevBtn').style.visibility = i===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').style.visibility = i===spreads.length-1 ? 'hidden' : 'visible';
  document.getElementById('pageIndicator').textContent =
    ['Front & Inside Left','Inside Right & Back'][i];
}

function turnPage(dir) {
  var n = cur + dir;
  if (n >= 0 && n < spreads.length) showSpread(n);
}

function closeCard() {
  hideEl('cardBook');
  hideEl('prevBtn');
  hideEl('nextBtn');
  hideEl('closeBtn');
  hideEl('pageIndicator');
  document.querySelectorAll('.page').forEach(function(p){ p.style.display='none'; });
  step = 1;
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('cardBook').style.display === 'none') return;
  if (e.key==='ArrowRight') turnPage(1);
  if (e.key==='ArrowLeft')  turnPage(-1);
  if (e.key==='Escape')     closeCard();
});
</script>
</body>
</html>
