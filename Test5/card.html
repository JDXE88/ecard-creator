<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your E-Card</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #f4f4f4; margin: 0; perspective: 1000px;
        }
        .container { position: relative; width: 300px; height: 200px; cursor: pointer; }
        .flip-container {
            width: 100%; height: 100%; transform-style: preserve-3d;
            transition: transform 1s ease-in-out;
        }
        .flipped { transform: rotateY(180deg); }
        .envelope, .envelope-back {
            position: absolute; width: 100%; height: 100%;
            background: #f5e1b3; border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 3px solid #e0c597; backface-visibility: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .stamp {
            position: absolute; top: 10px; right: 10px; width: 50px; height: auto;
            border: 2px solid #c0a060; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .address {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            text-align: center; font-family: 'Special Elite', cursive;
            font-size: 13px; color: #333; line-height: 1.5; max-width: 200px;
        }
        .address p { margin: 2px 0; }
        .hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            font-family: 'Special Elite', cursive; font-size: 11px;
            color: #9a7a50; white-space: nowrap;
        }
        .envelope-back { transform: rotateY(180deg); }
        .flap {
            position: absolute; width: 100%; height: 100px;
            background: #e3c998; top: 0; transform-origin: top;
            transition: transform 1s ease-in-out;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 3px solid #d1b48c;
        }
        .hint-back {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            font-family: 'Special Elite', cursive; font-size: 11px;
            color: #9a7a50; white-space: nowrap;
        }
        .ecard-container {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0; transition: transform 0.8s ease-in-out, opacity 0.8s;
            z-index: 10; max-width: 100%; max-height: 100%; cursor: pointer;
        }
        .ecard-container img {
            width: auto; height: auto; max-width: 90vw; max-height: 90vh;
            display: block; border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        .greeting-container {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff; padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0; transition: opacity 0.5s ease-in-out;
            z-index: 20; font-family: 'Special Elite', cursive;
            text-align: center; display: flex; flex-direction: column;
            justify-content: center; pointer-events: none;
        }
        .greeting-message {
            font-size: 20px; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap;
        }
        .close-greeting {
            display: inline-block; padding: 8px 16px; background-color: #e0c597;
            color: #333; border: none; border-radius: 5px; cursor: pointer;
            font-family: 'Special Elite', cursive; transition: background-color 0.3s;
            margin-top: auto; pointer-events: all;
        }
        .close-greeting:hover { background-color: #d1b48c; }
        .envelope-back.open .flap { transform: rotateX(180deg); }
        .show-greeting { opacity: 1 !important; pointer-events: all !important; }
        #error-msg {
            font-family: 'Special Elite', cursive; color: #9a7a50;
            text-align: center; padding: 40px; display: none;
        }
        #error-msg a { color: #c0a060; }
    </style>
</head>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const address = params.get('address');
        const message = params.get('message');
        const img = params.get('img');

        if (!name || !address || !message || !img) {
            document.getElementById('error-msg').style.display = 'block';
        } else {
            const addressBlock = document.getElementById('addressBlock');
            [name, ...address.split('\n')].forEach(line => {
                const p = document.createElement('p');
                p.textContent = line;
                addressBlock.appendChild(p);
            });
            document.getElementById('ecardImage').src = img;
            document.getElementById('greetingText').textContent = message;
            document.getElementById('envelopeContainer').style.display = 'block';
        }

        let isFlipped = false;

        function flipEnvelope() {
            if (!isFlipped) {
                document.querySelector('.flip-container').classList.add('flipped');
                isFlipped = true;
            }
        }

        function openEnvelope(event) {
            event.stopPropagation();
            document.querySelector('.envelope-back').classList.add('open');
            const ecard = document.getElementById('ecardContainer');
            ecard.style.opacity = '1';
            ecard.style.transform = 'translate(-50%, -50%) scale(1)';
        }

        function showGreeting() {
            const ecardImage = document.getElementById('ecardImage');
            const greetingContainer = document.getElementById('greetingContainer');
            greetingContainer.style.width = ecardImage.offsetWidth + 'px';
            greetingContainer.style.height = ecardImage.offsetHeight + 'px';
            greetingContainer.classList.add('show-greeting');
        }

        function closeGreeting() {
            window.location.reload();
        }
    </script>

</body>
</html>
