<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Folders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: #45a049;
            transform: translateY(-3px);
        }

        .button:active {
            background-color: #3e8e41;
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <h1>Welcome to GitHub Pages</h1>
    <div class="button-container">
        <a href="./Test1/index.html" class="button">Test1</a>
        <a href="./Test2/index.html" class="button">Test2</a>
        <a href="./Test3/index.html" class="button">Test3</a>
        <a href="./Test4/index.html" class="button">Test4</a>
    </div>
</body>
</html>
